name: Full A-Level Physics course audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout course and topic modules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble Vercel output
        run: bash scripts/vercel-build.sh

      - name: Run full static audit
        run: python3 tests/audit_static.py dist

      - name: Install browser audit dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local production server
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/alevel-course-http.log 2>&1 &
          echo $! > /tmp/alevel-course-http.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

      - name: Verify unified topic UI
        run: node tests/theme-smoke.mjs

      - name: Diagnose mobile overflow
        run: node tests/mobile-overflow.mjs

      - name: Run browser/runtime audit
        run: node tests/browser-smoke.mjs

      - name: Report assembled size
        if: always()
        run: du -sh dist || true
