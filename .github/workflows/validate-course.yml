name: Validate unified A-Level Physics course

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout course and topic modules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Assemble Vercel output
        run: bash scripts/vercel-build.sh

      - name: Verify course shell
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test -f dist/experience-polish.css
          test -f dist/lesson-enrichment.js
          test -f dist/lesson-enrichment.css
          test -f dist/tools/practicals/index.html
          test -f dist/topics/01-measurements/index.html
          test -f dist/topics/02-particles-radiation/index.html
          test -f dist/topics/03-waves/index.html
          test -f dist/topics/04-mechanics-materials/mechanics/index.html
          test -f dist/topics/04-mechanics-materials/materials/index.html
          test -f dist/topics/05-electricity/index.html
          test -f dist/topics/06-further-mechanics-thermal/index.html
          test -f dist/topics/07-fields/index.html
          test -f dist/topics/08-nuclear/index.html

      - name: Run comprehensive static audit
        run: node scripts/full-audit.mjs dist

      - name: Install browser audit dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production-like static server
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/alevel-course-http.log 2>&1 &
          echo $! > /tmp/alevel-course-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/alevel-course-http.log
          exit 1

      - name: Verify unified topic UI
        run: node tests/theme-smoke.mjs

      - name: Verify integrated study flow
        run: node tests/experience-flow.mjs

      - name: Verify lesson enrichment and notebook selection
        run: node tests/lesson-enrichment.mjs

      - name: Run browser runtime audit
        run: node scripts/browser-audit.mjs dist

      - name: Report assembled size
        run: du -sh dist
