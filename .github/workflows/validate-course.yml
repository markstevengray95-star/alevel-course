name: Validate unified A-Level Physics course

on:
  push:
    branches: [main, phase-10-quality-control]
  pull_request:

concurrency:
  group: alevel-course-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout course and topic modules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit AQA map and Phase 1-10 architecture
        run: node scripts/spec-audit.mjs .

      - name: Assemble Vercel output
        run: bash scripts/vercel-build.sh

      - name: Verify course shell and Phase 1-10 assets
        run: |
          required=(
            dist/index.html dist/app.js dist/styles.css dist/experience-polish.css
            dist/curriculum-map.js dist/curriculum-map.css
            dist/lesson-content.js dist/lesson-content.css
            dist/presentation-mode.js dist/lesson-phase3.js dist/lesson-phase3.css
            dist/lesson-activities.js dist/lesson-activities.css
            dist/lesson-simulations.js dist/lesson-simulations.css
            dist/lesson-assessment.js dist/lesson-assessment.css
            dist/lesson-progression.js dist/lesson-progression.css
            dist/lesson-teacher-tools.js dist/lesson-teacher-tools.css
            dist/lesson-astar.js dist/lesson-astar.css
            dist/quality-control.js dist/quality-control.css
            dist/tools/practicals/index.html
            dist/topics/01-measurements/index.html
            dist/topics/02-particles-radiation/index.html
            dist/topics/03-waves/index.html
            dist/topics/04-mechanics-materials/mechanics/index.html
            dist/topics/04-mechanics-materials/materials/index.html
            dist/topics/05-electricity/index.html
            dist/topics/06-further-mechanics-thermal/index.html
            dist/topics/07-fields/index.html
            dist/topics/08-nuclear/index.html
          )
          for file in "${required[@]}"; do test -f "$file" || { echo "Missing $file"; exit 1; }; done

      - name: Run comprehensive static audit
        run: node scripts/full-audit.mjs dist

      - name: Install browser audit dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production-like static server
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/alevel-course-http.log 2>&1 &
          echo $! > /tmp/alevel-course-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/alevel-course-http.log
          exit 1

      - name: Verify Phase 1-10 course system
        run: timeout 120s node tests/phase10-course-system.mjs

      - name: Verify unified topic UI
        run: timeout 120s node tests/theme-smoke.mjs

      - name: Verify simplified lesson navigation
        run: timeout 120s node tests/simple-navigation.mjs

      - name: Verify integrated study flow
        run: timeout 150s node tests/experience-flow.mjs

      - name: Verify lesson enrichment and notebook selection
        run: timeout 120s node tests/lesson-enrichment.mjs

      - name: Run browser runtime audit
        run: timeout 180s node scripts/browser-audit.mjs dist

      - name: Diagnose mobile overflow
        run: timeout 90s node tests/mobile-overflow.mjs

      - name: Report assembled size
        run: du -sh dist
