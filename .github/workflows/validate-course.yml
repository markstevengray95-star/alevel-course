name: Validate unified A-Level course

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout course and topic modules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Assemble Vercel output
        run: bash scripts/vercel-build.sh

      - name: Verify current AQA specification completeness
        run: |
          node --check subjects/specification-manifest.js
          node --check subjects/specification-audit.js
          node tests/specification-completeness.mjs

      - name: Verify presentation content and subject matching
        run: node tests/lesson-slide-design.cjs

      - name: Verify complete Biology lesson content
        run: |
          node --check subjects/biology-content.js
          node --check subjects/biology-lessons.js
          node tests/biology-content-coverage.mjs

      - name: Verify complete Chemistry lesson content
        run: |
          node --check subjects/chemistry-content.js
          node --check subjects/chemistry-lessons.js
          node tests/chemistry-content-coverage.mjs

      - name: Verify course shell
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/course-config.js
          test -f dist/styles.css
          test -f dist/experience-polish.css
          test -f dist/pricing-access.js
          test -f dist/pricing-access.css
          test -f dist/lesson-enrichment.js
          test -f dist/lesson-enrichment.css
          test -f dist/lesson-spec-depth.js
          test -f dist/lesson-spec-depth.css
          test -f dist/lesson-deepening.js
          test -f dist/lesson-deepening.css
          test -f dist/lesson-presentation-primary.js
          test -f dist/lesson-presentation-primary.css
          test -f dist/subjects/topic-shell.html
          test -f dist/subjects/subject-presentation.js
          test -f dist/subjects/biology-content.js
          test -f dist/subjects/biology-lessons.js
          test -f dist/subjects/chemistry-content.js
          test -f dist/subjects/chemistry-lessons.js
          test -f dist/subjects/specification-manifest.js
          test -f dist/subjects/specification-audit.html
          test -f dist/subjects/specification-audit.css
          test -f dist/subjects/specification-audit.js
          test -f dist/tools/practicals/index.html
          test -f dist/topics/01-measurements/index.html
          test -f dist/topics/02-particles-radiation/index.html
          test -f dist/topics/03-waves/index.html
          test -f dist/topics/04-mechanics-materials/mechanics/index.html
          test -f dist/topics/04-mechanics-materials/materials/index.html
          test -f dist/topics/05-electricity/index.html
          test -f dist/topics/06-further-mechanics-thermal/index.html
          test -f dist/topics/07-fields/index.html
          test -f dist/topics/08-nuclear/index.html

      - name: Run comprehensive static audit
        run: node scripts/full-audit.mjs dist

      - name: Verify pricing and access tiers
        run: node tests/pricing-access.mjs

      - name: Verify lesson uniqueness and presentation depth
        continue-on-error: true
        run: node tests/lesson-uniqueness.mjs

      - name: Run independent teaching-strength audit
        continue-on-error: true
        run: node tests/teaching-strength.mjs

      - name: Install browser audit dependency
        timeout-minutes: 5
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production-like static server
        timeout-minutes: 2
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/alevel-course-http.log 2>&1 &
          echo $! > /tmp/alevel-course-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/alevel-course-http.log
          exit 1

      - name: Verify app boot and topic navigation
        timeout-minutes: 3
        run: node tests/runtime-recovery.mjs

      - name: Verify unified topic UI
        timeout-minutes: 3
        run: node tests/theme-smoke.mjs

      - name: Verify Physics lessons open as presentations
        timeout-minutes: 3
        run: node tests/default-lesson-presentation.mjs

      - name: Verify detailed Biology and Chemistry lesson presentations
        timeout-minutes: 3
        run: node tests/subject-presentations.mjs

      - name: Verify Paper 3 option textbooks
        timeout-minutes: 3
        run: node tests/textbook-options-smoke.mjs

      - name: Verify Phase 17 specification dashboard
        timeout-minutes: 3
        run: node tests/specification-audit.mjs

      - name: Run legacy integrated study-flow diagnostics
        continue-on-error: true
        timeout-minutes: 3
        run: node tests/experience-flow.mjs

      - name: Verify lesson enrichment and notebook selection
        continue-on-error: true
        timeout-minutes: 3
        run: node tests/lesson-enrichment.mjs

      - name: Run browser runtime audit
        timeout-minutes: 5
        run: node scripts/browser-audit.mjs dist

      - name: Report assembled size
        if: always()
        run: du -sh dist
